    - [[8.75, 3.0], [8.75, 5.5], [8.75, 8.25], [8.75, 14.1]]
    - [[5.3, 14.1], [8.75, 14.1], [12.4, 14.1], [15.3, 14.1], [18, 14.1]]
    - [[15.3, 8.25], [15.3, 14.1]]
  props:
