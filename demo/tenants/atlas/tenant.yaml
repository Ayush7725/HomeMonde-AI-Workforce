    - {type: truck, at: [15.0, 6.95]}
    - {type: rack, at: [7.15, 2.0], label: A-12}
    - {type: pallets, at: [0.6, 5.6]}
    - {type: pallets, at: [16.0, 1.6]}
    - {type: staff, at: [2.45, 6.95]}
    - {type: staff, at: [11.2, 6.9]}
    - {type: tree, at: [0.8, 1.0]}
    - {type: tree, at: [22.3, 2.2], size: 1.05}
    - {type: tree, at: [22.4, 5.7], size: 0.9}
    - {type: tree, at: [0.9, 10.2]}
